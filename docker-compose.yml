version: "3.9"

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: intelligrievance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: intelligrievance_user
      POSTGRES_PASSWORD: intelligrievance_pass
      POSTGRES_DB: intelligrievance_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelligrievance_user -d intelligrievance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: intelligrievance_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://intelligrievance_user:intelligrievance_pass@db:5432/intelligrievance_db
      SECRET_KEY: change_this_in_production_to_a_random_64_char_hex_string
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      APP_ENV: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/ml/models:ro
      - ./ml/reports:/app/ml/reports:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: intelligrievance_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local
